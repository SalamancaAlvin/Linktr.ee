<head>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0c'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23c81e3a' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">

    <style>
        :root {
            --bg: #0a0a0c;
            --card: #16161a;
            --card-hover: #1c1c21;
            --border: #29292f;
            --text: #ececee;
            --text-dim: #86868f;
            --accent: #c81e3a;
            --accent-soft: rgba(200, 30, 58, 0.14);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
        }

        .font-display {
            font-family: 'Playfair Display', serif;
        }

        .watermark {
            position: fixed;
            top: -6vw;
            right: -3vw;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 42vw;
            line-height: 1;
            color: #ffffff;
            opacity: 0.025;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        .cursor-blink {
            display: inline-block;
            width: 0.5ch;
            background: var(--accent);
            margin-left: 2px;
            animation: blink 1.1s steps(1) infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .status-dot {
            animation: pulse 2.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(200, 30, 58, 0.55); }
            50% { box-shadow: 0 0 0 5px rgba(200, 30, 58, 0); }
        }

        .custom-pill {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 60px;
            background-color: var(--card);
            border-radius: 12px;
            margin-bottom: 12px;
            padding: 0 20px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: border-color 0.25s ease, background-color 0.25s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            text-decoration: none;
            color: var(--text);
            overflow: hidden;
        }

        .custom-pill::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.25s ease;
        }

        .custom-pill:hover {
            background-color: var(--card-hover);
            border-color: #3a3a42;
            transform: translateX(2px);
        }

        .custom-pill:hover::before {
            transform: scaleY(1);
        }

        .custom-pill:active {
            transform: translateX(0);
        }

        #stack-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s ease-out, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-bottom: 0;
        }

        #stack-content.show {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-bottom: 12px;
        }

        .stack-inner {
            overflow: hidden;
        }

        .eyebrow {
            letter-spacing: 0.18em;
            font-size: 11px;
            color: var(--text-dim);
        }

        .devicon-rust-plain { color: #f74c00 !important; }
        .devicon-cplusplus-plain { color: #659ad2 !important; }
        .devicon-python-plain { color: #4b8bbe !important; }
        .devicon-typescript-plain { color: #3fa1ff !important; }
        .devicon-react-original { color: #61dafb !important; }
        .devicon-nodejs-plain { color: #6cc24a !important; }
        .devicon-docker-plain { color: #3b9dea !important; }
        .devicon-azuresqldatabase-plain { color: #3fa1ff !important; }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translate(-50%, 12px);
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 12px;
            letter-spacing: 0.04em;
            padding: 10px 18px;
            border-radius: 999px;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor-blink, .status-dot { animation: none; }
            .custom-pill, .custom-pill::before, #toast { transition: none; }
        }

        a.custom-pill:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center text-[var(--text)] antialiased selection:bg-[var(--accent-soft)]">

    <div class="watermark" aria-hidden="true">L</div>

    <main class="relative z-10 w-full max-w-[540px] px-5 pt-14 pb-16 flex flex-col items-center">

        <header class="flex flex-col items-center mb-9 text-center">
            <div class="relative w-24 h-24 mb-5">
                <div class="w-full h-full rounded-full p-[2px]" style="background: linear-gradient(135deg, var(--accent), transparent 65%);">
                    <img src="https://static.wikia.nocookie.net/deathnote/images/d/dd/L_-_Anime.png/revision/latest?cb=20190315084358&path-prefix=es"
                         alt="Avatar de perfil de Lawliet (personaje L de Death Note)"
                         class="w-full h-full object-cover rounded-full border-2 border-[var(--bg)]"
                         onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Lawliet&background=16161a&color=ececee'">
                </div>
                <span class="status-dot absolute bottom-1 right-1 w-3.5 h-3.5 rounded-full bg-[var(--accent)] border-2 border-[var(--bg)]" aria-hidden="true"></span>
            </div>
            <h1 class="font-display text-3xl font-semibold tracking-tight text-white mb-2">@Lawliet</h1>
            <p class="eyebrow uppercase font-medium mb-3">
                Full&nbsp;Stack&nbsp;Developer<span class="cursor-blink" aria-hidden="true">&nbsp;</span>
            </p>
            <p class="text-[13px] text-[var(--text-dim)] max-w-[360px] leading-relaxed">
                Construyo software de punta a punta: del backend en Rust y Python a interfaces en React.
            </p>
        </header>

        <nav class="w-full">
            <a href="https://github.com/SalamancaAlvin" target="_blank" rel="noopener noreferrer" class="custom-pill" data-toast="Abriendo GitHub…">
                <i class="fa-brands fa-github text-xl w-6 text-center text-white"></i>
                <span class="font-semibold text-[15px] ml-4">GitHub</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-[var(--text-dim)] ml-auto"></i>
            </a>

            <a href="https://salamancaalvin.github.io/Lawliet/" target="_blank" rel="noopener noreferrer" class="custom-pill" data-toast="Abriendo portafolio…">
                <i class="fa-solid fa-terminal text-xl w-6 text-center" style="color: var(--accent);"></i>
                <span class="font-semibold text-[15px] ml-4">Portafolio</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-[var(--text-dim)] ml-auto"></i>
            </a>

            <button id="stack-button"
                    onclick="toggleStack()"
                    aria-expanded="false"
                    aria-controls="stack-content"
                    class="custom-pill w-full text-left">
                <i class="fa-solid fa-layer-group text-xl w-6 text-center" style="color: var(--accent);"></i>
                <span class="font-semibold text-[15px] ml-4">Tecnologías &amp; Stack</span>
                <i id="stack-arrow" class="fa-solid fa-chevron-down text-xs text-[var(--text-dim)] ml-auto transition-transform duration-300"></i>
            </button>

            <div id="stack-content" aria-hidden="true">
                <div class="stack-inner">
                    <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5">

                        <p class="eyebrow uppercase mb-3">// lenguajes</p>
                        <div class="grid grid-cols-4 gap-y-4 gap-x-2 mb-5">
                            <div class="flex flex-col items-center gap-1.5 p-2 rounded-lg hover:bg-white/5 transition-colors">
                                <i class="devicon-rust-plain text-3xl"></i>
                                <span class="text-[10px] font-bold text-[var(--text-dim)] tracking-wider">RUST</span>
                            </div>
                            <div class="flex flex-col items-center gap-1.5 p-2 rounded-lg hover:bg-white/5 transition-colors">
                                <i class="devicon-cplusplus-plain text-3xl"></i>
                                <span class="text-[10px] font-bold text-[var(--text-dim)] tracking-wider">C++</span>
                            </div>
                            <div class="flex flex-col items-center gap-1.5 p-2 rounded-lg hover:bg-white/5 transition-colors">
                                <i class="devicon-python-plain text-3xl"></i>
                                <span class="text-[10px] font-bold text-[var(--text-dim)] tracking-wider">PYTHON</span>
                            </div>
                            <div class="flex flex-col items-center gap-1.5 p-2 rounded-lg hover:bg-white/5 transition-colors">
                                <i class="devicon-typescript-plain text-3xl"></i>
                                <span class="text-[10px] font-bold text-[var(--text-dim)] tracking-wider">TS</span>
                            </div>
                        </div>

                        <p class="eyebrow uppercase mb-3">// frontend</p>
                        <div class="grid grid-cols-4 gap-y-4 gap-x-2 mb-5">
                            <div class="flex flex-col items-center gap-1.5 p-2 rounded-lg hover:bg-white/5 transition-colors">
                                <i class="devicon-react-original text-3xl"></i>
                                <span class="text-[10px] font-bold text-[var(--text-dim)] tracking-wider">REACT</span>
                            </div>
                        </div>

                        <p class="eyebrow uppercase mb-3">// backend &amp; devops</p>
                        <div class="grid grid-cols-4 gap-y-4 gap-x-2">
                            <div class="flex flex-col items-center gap-1.5 p-2 rounded-lg hover:bg-white/5 transition-colors">
                                <i class="devicon-nodejs-plain text-3xl"></i>
                                <span class="text-[10px] font-bold text-[var(--text-dim)] tracking-wider">NODE.JS</span>
                            </div>
                            <div class="flex flex-col items-center gap-1.5 p-2 rounded-lg hover:bg-white/5 transition-colors">
                                <i class="devicon-docker-plain text-3xl"></i>
                                <span class="text-[10px] font-bold text-[var(--text-dim)] tracking-wider">DOCKER</span>
                            </div>
                            <div class="flex flex-col items-center gap-1.5 p-2 rounded-lg hover:bg-white/5 transition-colors">
                                <i class="devicon-azuresqldatabase-plain text-3xl"></i>
                                <span class="text-[10px] font-bold text-[var(--text-dim)] tracking-wider">SQL</span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <a href="https://www.linkedin.com/in/alvin-salamanca-b74a663a1/" target="_blank" rel="noopener noreferrer" class="custom-pill" data-toast="Abriendo LinkedIn…">
                <i class="fa-brands fa-linkedin text-xl w-6 text-center" style="color: #4a9fd8;"></i>
                <span class="font-semibold text-[15px] ml-4">LinkedIn</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-[var(--text-dim)] ml-auto"></i>
            </a>

            <button type="button"
                    id="email-button"
                    onclick="copyEmail()"
                    class="custom-pill w-full text-left">
                <i class="fa-solid fa-envelope text-xl w-6 text-center shrink-0" style="color: var(--accent);"></i>
                <span class="font-semibold text-[13px] sm:text-[15px] ml-4 truncate">contactlawlietdev@proton.me</span>
                <i id="email-icon" class="fa-regular fa-copy text-[12px] text-[var(--text-dim)] ml-auto shrink-0"></i>
            </button>
        </nav>

        <footer class="mt-14 flex items-center gap-2 text-[var(--text-dim)] text-[11px] tracking-wide">
            <span class="w-6 h-6 rounded-full border border-[var(--border)] flex items-center justify-center font-display text-[13px] text-[var(--accent)]">L</span>
            <span>&copy; <span id="year"></span> Lawliet — todos los derechos reservados</span>
        </footer>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
        function toggleStack() {
            const content = document.getElementById('stack-content');
            const button = document.getElementById('stack-button');
            const arrow = document.getElementById('stack-arrow');

            const isExpanded = button.getAttribute('aria-expanded') === 'true';

            button.setAttribute('aria-expanded', !isExpanded);
            content.setAttribute('aria-hidden', isExpanded);

            content.classList.toggle('show');
            arrow.style.transform = isExpanded ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        document.getElementById('year').textContent = new Date().getFullYear();

        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
        }

        document.querySelectorAll('a.custom-pill[data-toast]').forEach(link => {
            link.addEventListener('click', () => showToast(link.dataset.toast));
        });

        function copyEmail() {
            const email = 'contactlawlietdev@proton.me';
            const icon = document.getElementById('email-icon');

            function onCopied() {
                showToast('Email copiado ✓');
                icon.classList.remove('fa-copy');
                icon.classList.add('fa-check');
                icon.style.color = 'var(--accent)';
                setTimeout(() => {
                    icon.classList.remove('fa-check');
                    icon.classList.add('fa-copy');
                    icon.style.color = '';
                }, 1400);
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(email).then(onCopied).catch(() => showToast('No se pudo copiar'));
            } else {
                const temp = document.createElement('textarea');
                temp.value = email;
                document.body.appendChild(temp);
                temp.select();
                try {
                    document.execCommand('copy');
                    onCopied();
                } catch (e) {
                    showToast('No se pudo copiar');
                }
                document.body.removeChild(temp);
            }
        }
    </script>

</body>
</html>
